name: HAIZ WORLD · Prototype and V3 transaction checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source fidelity and V3 fallback
        run: node --test tests/v3-transaction.test.mjs tests/spatial-source.test.mjs tests/atlas-bridge.test.mjs tests/photo-references.test.mjs
